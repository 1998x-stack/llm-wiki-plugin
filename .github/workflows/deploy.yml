name: Build & Deploy Knowledge Graph

on:
  push:
    branches: [main]
    paths:
      - 'vault/wiki/**'
      - 'vault/scripts/**'
      - 'static/**'
      - 'requirements.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint wiki pages
        working-directory: vault
        run: python3 scripts/lint_wiki.py --json
        continue-on-error: true

      - name: Build graph + statistics + wiki pages
        working-directory: vault
        run: python3 scripts/build_graph.py --output ../static/graph.json --full

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static/

  deploy:
    needs: lint-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
