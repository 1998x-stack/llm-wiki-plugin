# UrhoX Lua Examples Configuration
# 描述 ai-dev-kit/examples/ 中示例的元信息，用于生成文档索引和引用
# 所有路径均相对于 ai-dev-kit/ 根目录

version: "1.0"

# 配置说明
# source: 引擎源码中的原始路径（仅用于构建同步脚本，部署环境中不使用）
# target: 示例文件路径（相对于 ai-dev-kit/examples/）
# metadata: 示例的元信息
#   - title: 示例标题（中英文）
#   - category: 分类
#   - difficulty: 难度级别（beginner, intermediate, advanced）
#   - description: 简短描述
#   - features: 主要展示的功能列表
#   - apis: 使用到的主要 API
#   - concepts: 涉及的核心概念
#   - tags: 标签（用于分类和搜索）
#   - line_count: 大致行数（可选）
#   - dependencies: 依赖的 ai-dev-kit 内其他文件（可选，路径相对于 ai-dev-kit/）
#   - engine_deps: 引擎运行时提供的依赖（非 ai-dev-kit 内文件，仅供参考）

