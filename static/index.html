<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=graph.html">
<title>LLM Wiki</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a2e; --fg2: #555; --link: #4A90D9; }
  .dark { --bg: #1a1a2e; --fg: #e0e0e0; --fg2: #aaa; --link: #6db3f2; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    height: 100vh; transition: background 0.3s, color 0.3s;
  }
  p { font-size: 14px; color: var(--fg2); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
<script>
  if (window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.classList.add('dark');
</script>
</head>
<body>
<p>Redirecting to <a href="graph.html">Knowledge Graph</a>…</p>
</body>
</html>
